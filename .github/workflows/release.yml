name: release
# Publishes sous-factory (core, the bundled UI and the starter) when a
# `v<version>` tag is pushed. npm trusts this workflow file through trusted
# publishing (OIDC), so no token is stored. The publish job runs in the `npm`
# environment because the trusted publisher entry on npmjs.com names it; the
# environment has no required reviewers, so a tag publishes without a hand.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches packages/core version
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/core version ${version}" >&2
            exit 1
          fi
      # The release notes are the version's section; a tag without one stops here, before anything is published.
      - name: CHANGELOG.md has a section for the version
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run starter:install
      - run: npm run starter:test
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # prepublishOnly builds core, the UI and the bundle; a prerelease (1.2.0-rc.1) goes to the `next` tag.
      - name: npm publish
        working-directory: packages/core
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac
  # The GitHub Release carries the version's CHANGELOG.md section as its notes, once npm has the package.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/changelog-section.sh "$version" > notes.md
          case "$version" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" --title "sous-factory ${version}" --notes-file notes.md $prerelease
