name: hello-world
description: Test-bench step (flows/bench.yaml), a deterministic module that greets `name` and reports what it saw of the run. Touches nothing.

inputs:
  name: { required: false, description: "who to greet; defaults to world" }

run:
  module: ./run.ts
  output:
    type: object
    required: [greeting, name, work]
    properties:
      greeting: { type: string }
      name: { type: string }
      work: { type: string, description: "ctx.work.id at the time of the visit" }
