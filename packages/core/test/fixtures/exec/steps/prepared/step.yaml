name: prepared
description: A prompt step with a prepare whose verdict follows `mode`, and an eval that reports what it saw.
inputs:
  task: { required: true }
  mode: { required: false, description: "always (default), on-fail, never, work (puts #14 on the bench) or bad (output off the schema)" }
  fail: { required: false, prompt: false, description: "true: the eval is red until an agent result arrives" }
prepare:
  module: ./prepare.ts
  output:
    type: object
    required: [note]
    properties:
      note: { type: string }
      extra: { type: string }
run:
  prompt: prompt.md
  output:
    type: object
    properties:
      ok: { type: boolean }
eval: ./eval.ts
